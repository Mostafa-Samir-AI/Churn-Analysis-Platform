
<style>
#erd-star { padding: 8px 0; }
#erd-star svg { max-width: 100%; }
</style>
<p style="font-size:13px;font-weight:500;color:var(--color-text-secondary);margin:4px 0 10px;">Star Schema (DW) — 1 fact · 6 dimensions</p>
<div id="erd-star"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#26215c' : '#eeedfe',
    primaryBorderColor: dark ? '#534ab7' : '#7f77dd',
    secondaryColor: dark ? '#085041' : '#e1f5ee',
    secondaryBorderColor: dark ? '#0f6e56' : '#1d9e75',
    tertiaryColor: dark ? '#412402' : '#faeeda',
    tertiaryBorderColor: dark ? '#854f0b' : '#ba7517',
  },
});
const diagram = `erDiagram
  fact_CustomerSnapshot }o--|| dim_Customer : "CustomerSK"
  fact_CustomerSnapshot }o--|| dim_PhoneService : "PhoneServiceSK"
  fact_CustomerSnapshot }o--|| dim_InternetService : "InternetServiceSK"
  fact_CustomerSnapshot }o--|| dim_Contract : "ContractSK"
  fact_CustomerSnapshot }o--|| dim_PaymentMethod : "PaymentMethodSK"
  fact_CustomerSnapshot }o--|| dim_Date : "SnapshotDateSK"

  fact_CustomerSnapshot {
    bigint SnapshotSK PK
    int CustomerSK FK
    int PhoneServiceSK FK
    int InternetServiceSK FK
    int ContractSK FK
    int PaymentMethodSK FK
    int SnapshotDateSK FK
    smallint Tenure "measure"
    decimal MonthlyCharges "measure"
    decimal TotalCharges "measure nullable"
    decimal AnnualizedCharges "derived measure"
    bit HasChurned "degenerate dim"
  }
  dim_Customer {
    int CustomerSK PK
    nvarchar CustomerID "natural key"
    nvarchar Gender
    bit IsSeniorCitizen
    bit HasPartner
    bit HasDependents
    date EffectiveDate "SCD Type-1"
  }
  dim_PhoneService {
    int PhoneServiceSK PK
    bit HasPhoneService
    bit HasMultipleLines "nullable"
    nvarchar ServiceProfile
  }
  dim_InternetService {
    int InternetServiceSK PK
    nvarchar InternetServiceType
    bit HasOnlineSecurity "nullable"
    bit HasOnlineBackup "nullable"
    bit HasDeviceProtection "nullable"
    bit HasTechSupport "nullable"
    bit HasStreamingTV "nullable"
    bit HasStreamingMovies "nullable"
    tinyint AddOnCount "derived"
    nvarchar ServiceProfile
  }
  dim_Contract {
    int ContractSK PK
    nvarchar ContractType
    bit IsPaperless
    nvarchar BillingProfile
  }
  dim_PaymentMethod {
    int PaymentMethodSK PK
    nvarchar MethodName
    bit IsAutomatic
    nvarchar MethodCategory
  }
  dim_Date {
    int DateSK PK "YYYYMMDD"
    date FullDate
    smallint Year
    tinyint Quarter
    tinyint Month
    nvarchar MonthName
    tinyint DayOfMonth
    nvarchar DayOfWeekName
    bit IsWeekend
  }
`;
const { svg } = await mermaid.render('star-svg', diagram);
document.getElementById('erd-star').innerHTML = svg;
document.querySelectorAll('#erd-star svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill','stroke','stroke-width','class','style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd-star svg .row-rect-odd path, #erd-star svg .row-rect-even path').forEach(p => p.setAttribute('stroke','none'));
</script>
